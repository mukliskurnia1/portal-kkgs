<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOPERASI KONSUMEN KARYAWAN GRIYA SUMEDANG</title>
    <link rel="icon" href="https://res.cloudinary.com/dvvjbnjzd/image/upload/v1234567/logo_anda.jpg" type="image/png">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .loader-container { text-align: center; }
        .spinner { border: 4px solid rgba(0, 0, 0, 0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: #d84b22; animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="loader-container">
        <div class="spinner"></div>
        <h3 style="color: #333;">Mengalihkan ke Sistem KKGS...</h3>
        <p style="color: #666; font-size: 0.9rem;">Mohon tunggu sebentar.</p>
    </div>

    <script>
        const googleScriptUrl = "https://script.google.com/macros/s/AKfycbxOMRn097gaC-Qm5kfyS2P730DquRdGYnPkABPw1hXuM29CV4q1sO928aEvY-w514d_/exec";
        const currentParams = window.location.search || "";
        
        // PERBAIKAN: Menggunakan window.top.location.href untuk menjebol keluar dari iframe
        window.top.location.href = googleScriptUrl + currentParams;
    </script>

</body>
</html>
