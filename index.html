<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Koperasi KKGS</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #f4f7f6; font-family: sans-serif; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>

    <iframe id="gas-frame" title="Portal Koperasi KKGS"></iframe>

    <script>
        // 1. Ini link asli Web App Google Script Anda
        const scriptUrl = "https://script.google.com/macros/s/AKfycbxOMRn097gaC-Qm5kfyS2P730DquRdGYnPkABPw1hXuM29CV4q1sO928aEvY-w514d_/exec";
        
        // 2. Tangkap parameter dari kkgs.web.id (misal: ?page=neraca_public)
        const queryString = window.location.search; 
        
        // 3. Gabungkan dan masukkan ke dalam Iframe
        document.getElementById("gas-frame").src = scriptUrl + queryString;
    </script>

</body>
</html>
